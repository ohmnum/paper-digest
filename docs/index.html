<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>논문 데일리</title>
<meta name="description" content="LLM 데이터·표상·행동교정 관련 새 논문을 매일 모아 한국어로 요약">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1f;--sub:#5f6168;--faint:#8b8d94;--line:#e4e2dc;
  --accent:#2f5bd3;--accent-soft:#e8eefc;--hot:#c2410c;--hot-soft:#fdeee4;--ok:#15803d;--ok-soft:#e5f5ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --memo-bg:#fff6d6;--memo-ink:#5a4500;--memo-line:#e0b100;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518;--card:#1c1d21;--ink:#ececef;--sub:#a8aab2;--faint:#7c7f88;--line:#2c2e34;
  --accent:#7ea2ff;--accent-soft:#1f2a45;--hot:#fb923c;--hot-soft:#3a2416;--ok:#4ade80;--ok-soft:#173022;
  --memo-bg:#3a3217;--memo-ink:#f3dc8a;--memo-line:#b8901a;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#141518;--card:#1c1d21;--ink:#ececef;--sub:#a8aab2;--faint:#7c7f88;--line:#2c2e34;
  --accent:#7ea2ff;--accent-soft:#1f2a45;--hot:#fb923c;--hot-soft:#3a2416;--ok:#4ade80;--ok-soft:#173022;
  --memo-bg:#3a3217;--memo-ink:#f3dc8a;--memo-line:#b8901a;
  --shadow:none;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 0 10px}
.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.upd{color:var(--faint);font-size:12.5px}
.theme{margin-left:auto;background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:3px 9px;cursor:pointer;font:inherit;font-size:12.5px}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#q{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;color:var(--sub);padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.day{margin:26px 0 10px;font-weight:700;font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center}
.day span{font-weight:400;color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card.read{opacity:.62}
.row{display:flex;gap:10px;align-items:flex-start}
.score{flex:none;min-width:34px;text-align:center;font-weight:700;font-size:13px;border-radius:8px;padding:2px 0;background:var(--accent-soft);color:var(--accent)}
.score.hi{background:var(--hot-soft);color:var(--hot)}
.main{flex:1;min-width:0;cursor:pointer}
.tko{font-weight:700;font-size:16px;line-height:1.45}
.ten{color:var(--faint);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.tldr{margin-top:6px;color:var(--ink)}
.aff{color:var(--sub);font-size:12.5px;margin-top:3px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.b{border-radius:6px;padding:1px 7px;background:var(--bg);color:var(--sub);border:1px solid var(--line)}
.b.v{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:500}
.acts{display:flex;flex-direction:column;gap:4px}
.ic{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:30px;cursor:pointer;color:var(--faint);font-size:15px}
.ic.on{color:var(--hot);border-color:var(--hot)}
.ic.rd.on{color:var(--ok);border-color:var(--ok)}
.det{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.card.open .det{display:block}
.det ul{margin:0;padding-left:18px}
.det li{margin:3px 0}
.why{margin-top:10px;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
.why b{color:var(--accent)}
figure{margin:14px 0 4px}
figure img{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block}
figcaption{color:var(--sub);font-size:13px;margin-top:6px}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13.5px}
.links a{color:var(--accent);text-decoration:none}
.links a:hover{text-decoration:underline}
details.abs{margin-top:10px;font-size:13.5px;color:var(--sub)}
details.abs summary{cursor:pointer;color:var(--faint)}
.authors{color:var(--faint);font-size:12.5px;margin-top:8px}
.more{display:block;margin:28px auto;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:9px 18px;font:inherit;cursor:pointer}
.empty{text-align:center;color:var(--faint);margin:60px 0}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
@media (max-width:520px){.tko{font-size:15px}.acts{flex-direction:row}.row{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end;order:3}}
.memo{width:100%;box-sizing:border-box;margin-top:10px;padding:8px 10px;border:1px solid var(--line,#ccc);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
.b.m{background:var(--memo-bg);color:var(--memo-ink);border-color:transparent}
.ic.mm.on{color:var(--memo-ink);border-color:var(--memo-line);background:var(--memo-bg)}
.mprev{margin-top:8px;background:var(--memo-bg);color:var(--memo-ink);border-left:3px solid var(--memo-line);border-radius:8px;padding:6px 10px;font-size:13.5px;
  line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-height:calc(3*1.6em + 12px);overflow:hidden;cursor:text}
.memoview .mprev{max-height:none}
.pill{background:none;border:1px solid var(--line);color:var(--sub);border-radius:999px;padding:2px 10px;cursor:pointer;font:inherit;font-size:12px}
#dback{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:29}
body.memo-open{overflow:hidden}body.memo-open #dback{display:block}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(640px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);
  transform:translateX(105%);transition:transform .2s ease,width .2s ease;z-index:30;display:flex;flex-direction:column}
#drawer.on{transform:none}#drawer.wide{width:100vw}
.dh{display:flex;gap:8px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}.dt{font-weight:700;font-size:16px;line-height:1.45}
.dbtn{flex:none;background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:32px;cursor:pointer;color:var(--sub);font-size:15px}
.dref{padding:8px 16px 0;font-size:13.5px;color:var(--sub);max-height:34vh;overflow:auto}
.dref summary{cursor:pointer;color:var(--faint);font-size:12.5px}.dref p{margin:6px 0}.dref ul{margin:4px 0;padding-left:18px}
#dmemo{flex:1;min-height:180px;margin:12px 16px 6px;padding:14px 16px;font:inherit;font-size:15.5px;line-height:1.75;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);resize:none;outline:none}
#dmemo:focus{border-color:var(--accent)}
.df{display:flex;gap:12px;flex-wrap:wrap;padding:4px 16px 14px;font-size:12.5px;color:var(--faint)}
#sync{margin-bottom:8px;line-height:2}#sync input{font:inherit;width:220px;max-width:100%;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.foot{font-size:13px;opacity:.75;padding-top:24px;padding-bottom:40px}.foot button,.foot .imp{font:inherit;cursor:pointer;text-decoration:underline;background:none;border:0;color:inherit;padding:0}
.b.y{font-weight:600}
.b.k{background:var(--accent-soft,rgba(80,120,255,.12))}
.chip.br{font-weight:600;border-style:dashed}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <div class="top"><h1>📄 논문 데일리</h1><span class="upd" id="upd"></span>
    <button class="pill" id="syncpill" title="저장 상태 · 누르면 동기화 설정으로 이동">☁ <span data-syncst></span></button>
    <button class="theme" id="theme" title="밝게/어둡게">◐</button></div>
  <div class="bar">
    <input id="q" type="search" placeholder="검색: 한글·영어 모두 (제목, 초록, 저자, 소속, 연도 · 예: refusal, 2024, Anthropic)">
    <div class="seg" id="view">
      <button data-v="all" class="on">전체</button><button data-v="unread">안 읽음</button><button data-v="star">★ 보관</button><button data-v="memo">📝 메모</button>
    </div>
    <div class="seg" id="sort"><button data-s="date" class="on">최신순</button><button data-s="score">관련도순</button></div>
  </div>
  <div class="tags" id="tags"></div>
</div></header>
<main class="wrap" id="list"><div class="empty">불러오는 중…</div></main>
<footer class="wrap foot"><div id="sync"></div>파일로 백업하거나 옮기려면
  <button id="exp">내보내기</button> <label class="imp">가져오기<input type="file" id="imp" accept=".json" hidden></label></footer>
<div id="zoom"><img alt=""></div>
<div id="dback"></div>
<aside id="drawer" aria-label="메모">
  <div class="dh"><div class="t"><div class="dt" id="dt"></div><div class="ten" id="de"></div></div>
    <button class="dbtn" id="dwide" title="넓게/좁게">↔</button><button class="dbtn" id="dclose" title="닫기 (Esc)">✕</button></div>
  <details class="dref" open><summary>논문 요약 보기</summary><div id="dref"></div></details>
  <textarea id="dmemo" placeholder="여기에 메모를 쓰세요. 입력하면 자동 저장됩니다.&#10;&#10;예) 우리 게이트 실험에 쓸 만한 점 / 의문점 / 다음에 할 일"></textarea>
  <div class="df"><span>☁ <span data-syncst></span></span><span id="dcnt"></span><span style="margin-left:auto">Esc 또는 바깥을 누르면 닫힘</span></div>
</aside>
<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let months=[],loaded=0,papers=[],view="all",tag="",q="",sort="date";
const star=new Set(store.get("star",[])),read=new Set(store.get("read",[]));
const memo=store.get("memo",{});
// 기기 간 동기화: 논문별 기록 {memo, star, read, ts}을 비공개 저장소 ohmnum/paper-notes 의 notes.json 에 저장 (토큰은 이 브라우저에만 보관)
const rec=store.get("rec",{});
const NOTES="https://api.github.com/repos/ohmnum/paper-notes/contents/notes.json";
let tok=store.get("gh_token",""),sha=null,syncT=null,syncState=tok?"…":"off";
function touch(id){rec[id]={memo:memo[id]||"",star:star.has(id),read:read.has(id),ts:Date.now()};store.set("rec",rec);queueSync()}
function apply(r){let ch=false;for(const[id,v]of Object.entries(r)){if(rec[id]&&rec[id].ts>=v.ts)continue;rec[id]=v;ch=true;
  if(v.memo)memo[id]=v.memo;else delete memo[id];v.star?star.add(id):star.delete(id);v.read?read.add(id):read.delete(id)}
  if(ch){store.set("rec",rec);store.set("memo",memo);store.set("star",[...star]);store.set("read",[...read])}return ch}
const b64e=t=>{const u=new TextEncoder().encode(t);let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const b64d=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghH=()=>({Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"});
async function pull(){const r=await fetch(NOTES+"?t="+Date.now(),{headers:ghH(),cache:"no-store"});
  if(!r.ok)throw new Error(r.status);const j=await r.json();sha=j.sha;return JSON.parse(b64d(j.content)||"{}")}
async function sync(){if(!tok)return;setSync("저장 중…");
  try{for(let i=0;i<3;i++){const remote=await pull();if(apply(remote))render();
      const merged={...remote};for(const[id,v]of Object.entries(rec))if(!merged[id]||merged[id].ts<v.ts)merged[id]=v;
      if(JSON.stringify(merged)===JSON.stringify(remote)){setSync("☁ 저장됨");return}
      const r=await fetch(NOTES,{method:"PUT",headers:ghH(),body:JSON.stringify({message:"notes "+new Date().toISOString(),content:b64e(JSON.stringify(merged)),sha})});
      if(r.ok){sha=(await r.json()).content.sha;setSync("☁ 저장됨");return}
      if(r.status!==409&&r.status!==422)throw new Error(r.status)}
    throw new Error("충돌")}
  catch(e){setSync(["401","403","404"].includes(e.message)?"⚠ 토큰이 틀렸거나 권한이 없음 ("+e.message+")":"⚠ 저장 실패 ("+e.message+")")}}
function queueSync(){if(!tok)return;setSync("저장 대기…");clearTimeout(syncT);syncT=setTimeout(sync,1500)}
function setSync(t){syncState=t;document.querySelectorAll("[data-syncst]").forEach(b=>b.textContent=t==="off"?"이 브라우저에만 저장":t)}
function syncUI(){const el=document.getElementById("sync");if(!el)return;
  el.innerHTML=tok?`☁ 기기 간 동기화 켜짐 · <b data-syncst></b> · <button id="syncnow">지금 저장</button> · <button id="syncoff">이 기기에서 끄기</button>`
    :`☁ <b>기기 간 동기화 꺼짐</b> (지금은 이 브라우저에만 저장) · GitHub 토큰을 넣으면 메모·★·읽음이 모든 기기에 저장됩니다 <input id="tokin" type="password" placeholder="github_pat_…" autocomplete="off"> <button id="tokset">켜기</button>`;
  const g=id=>document.getElementById(id);
  if(g("tokset"))g("tokset").onclick=async()=>{const v=g("tokin").value.trim();if(!v)return;tok=v;store.set("gh_token",tok);
    Object.keys(memo).concat([...star],[...read]).forEach(id=>{if(!rec[id])rec[id]={memo:memo[id]||"",star:star.has(id),read:read.has(id),ts:1}});store.set("rec",rec);
    syncUI();await sync();if(syncState.startsWith("⚠")){const m=syncState;tok="";store.set("gh_token","");syncState="off";syncUI();alert("연결 실패: "+m)}};
  setSync(tok?syncState:"off");
  if(g("syncnow"))g("syncnow").onclick=sync;
  if(g("syncoff"))g("syncoff").onclick=()=>{tok="";store.set("gh_token","");syncState="off";syncUI()}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const WD=["일","월","화","수","목","금","토"];
function dayLabel(d){const t=new Date(d+"T00:00:00");return `${t.getFullYear()!==new Date().getFullYear()?t.getFullYear()+"년 ":""}${t.getMonth()+1}월 ${t.getDate()}일 (${WD[t.getDay()]})`}

(function theme(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
  $("#theme").onclick=()=>{const dark=matchMedia("(prefers-color-scheme: dark)").matches;
    const cur=document.documentElement.dataset.theme||(dark?"dark":"light");const nx=cur==="dark"?"light":"dark";
    document.documentElement.dataset.theme=nx;store.set("theme",nx)}})();

async function loadMonth(){if(loaded>=months.length)return;
  const r=await fetch(`data/${months[loaded]}.json?t=${Date.now()}`);papers=papers.concat(await r.json());loaded++}

function match(p){
  if(view==="star"&&!star.has(p.id))return false;
  if(view==="unread"&&read.has(p.id))return false;
  if(view==="memo"&&!memo[p.id])return false;
  if(tag&&!(p.tags||[]).includes(tag))return false;
  if(q){const h=[p.title,p.title_ko,p.tldr,(p.bullets||[]).join(" "),(p.tags||[]).join(" "),p.why,p.venue,(p.authors||[]).join(" "),p.abstract,(p.affiliations||[]).join(" "),p.comment,p.id,p.published,memo[p.id]||""].join(" ").toLowerCase();
    if(!q.split(/\s+/).every(w=>h.includes(w)))return false}
  return true}

function card(p){
  const hi=p.score>=9?" hi":"";
  const yr=(p.published||"").slice(0,7).replace("-",".");
  const kd=p.kind||(p.url?"PDF":"arXiv 논문");
  const kind=`<span class="b k">${{"블로그":"📝","PDF":"📑"}[kd]||"📄"} ${esc(kd)}</span>`+(p.blog?`<span class="b k">📝 블로그 글 있음</span>`:"");
  const venue=p.venue?`<span class="b v">${esc(p.venue)}</span>`:"";
  const tags=(p.tags||[]).map(t=>`<span class="b">${esc(t)}</span>`).join("");
  const src=p.source==="HF Daily"?`<span class="b">🤗 HF${p.upvotes?` ▲${p.upvotes}`:""}</span>`:"";
  const fig=p.figure?`<figure><img loading="lazy" src="${esc(p.figure.src)}" alt="제안 방법 그림" onerror="this.parentNode.remove()"><figcaption>${esc(p.fig_ko||"")}</figcaption></figure>`:"";
  const au=(p.authors||[]).join(", ")+(p.n_authors>(p.authors||[]).length?` 외 ${p.n_authors-p.authors.length}명`:"");
  return `<article class="card${read.has(p.id)?" read":""}" data-id="${esc(p.id)}">
  <div class="row"><div class="score${hi}" title="관련도(0-10)">${Math.round(p.score)}</div>
   <div class="main" data-toggle>
    <div class="tko">${esc(p.title_ko||p.title)}</div><div class="ten">${esc(p.title)}</div>
    ${(p.affiliations||[]).length?`<div class="aff">🏛 ${esc(p.affiliations.join(" · "))}</div>`:""}
    <div class="tldr">${esc(p.tldr)}</div>
    ${memo[p.id]?`<div class="mprev" data-memobtn title="눌러서 메모 열기">${esc(memo[p.id])}</div>`:""}
    <div class="meta">${memo[p.id]?`<span class="b m">📝 메모</span>`:""}<span class="b y">📅 ${esc(yr)} 공개</span>${kind}${venue}${src}${tags}</div></div>
   <div class="acts"><button class="ic${star.has(p.id)?" on":""}" data-star title="보관">★</button>
    <button class="ic rd${read.has(p.id)?" on":""}" data-read title="읽음 표시">✓</button>
    <button class="ic mm${memo[p.id]?" on":""}" data-memobtn title="메모 쓰기">📝</button></div></div>
  <div class="det"><ul>${(p.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>
   ${p.why?`<div class="why"><b>왜 볼 만한가</b> · ${esc(p.why)}</div>`:""}
   ${fig}
   <div class="authors">${esc(au)} · ${esc(p.published)} 공개${p.comment?` · ${esc(p.comment)}`:""}</div>
   <div class="links">${p.blog?`<a href="${esc(p.blog)}" target="_blank" rel="noopener">📝 블로그 글</a>`:""}
    ${p.pdf?`<a href="${esc(p.pdf)}" target="_blank" rel="noopener">원문 PDF</a>`:""}
    ${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${kd==="블로그"?"📝 블로그 글":"PDF"}</a>`:`<a href="https://arxiv.org/abs/${esc(p.id)}" target="_blank" rel="noopener">arXiv</a>
    <a href="https://arxiv.org/pdf/${esc(p.id)}" target="_blank" rel="noopener">PDF</a>
    ${p.html?`<a href="https://arxiv.org/html/${esc(p.id)}" target="_blank" rel="noopener">HTML 본문</a>`:""}
    <a href="https://huggingface.co/papers/${esc(p.id)}" target="_blank" rel="noopener">HF 토론</a>`}
    <a href="https://scholar.google.com/scholar?q=${encodeURIComponent(p.title)}" target="_blank" rel="noopener">Scholar</a></div>
   <details class="abs"><summary>원문 초록</summary>${esc(p.abstract)}</details></div></article>`}

function render(){
  const list=papers.filter(match),out=[];let cur="";
  if(sort==="score"){list.sort((a,b)=>b.score-a.score||b.published.localeCompare(a.published));
    out.push(`<div class="day">관련도 높은 순 <span>${list.length}편</span></div>`);list.forEach(p=>out.push(card(p)))}
  else for(const p of list){if(p.collected!==cur){cur=p.collected;const n=list.filter(x=>x.collected===cur).length;
      const old=list.filter(x=>x.collected===cur).every(x=>x.backfill);
      out.push(`<div class="day">${old?"📅 논문 공개일":"📥 수집일"} · ${dayLabel(cur)} <span>${n}편</span></div>`)}out.push(card(p))}
  if(!list.length)out.push(`<div class="empty">${view==="star"?"보관한 논문이 없습니다":"조건에 맞는 논문이 없습니다"}</div>`);
  if(loaded<months.length)out.push(`<button class="more" id="more">이전 달 더 보기 (${months[loaded]})</button>`);
  $("#list").innerHTML=out.join("");$("#list").classList.toggle("memoview",view==="memo");
  const m=$("#more");if(m)m.onclick=async()=>{await loadMonth();renderTags();render()}}

function renderTags(){const c={};papers.forEach(p=>(p.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  const br={};papers.forEach(p=>p.branch&&(br[p.branch]=(br[p.branch]||0)+1));
  const top=Object.entries(c).filter(([t])=>!(t in br)).sort((a,b)=>b[1]-a[1]).slice(0,14);
  $("#tags").innerHTML=Object.entries(br).map(([t,n])=>`<button class="chip br${t===tag?" on":""}" data-tag="${esc(t)}">갈래 · ${esc(t)} ${n}</button>`).join("")+top.map(([t,n])=>`<button class="chip${t===tag?" on":""}" data-tag="${esc(t)}">${esc(t)} ${n}</button>`).join("")}

$("#list").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;const id=c.dataset.id;
  if(e.target.closest("[data-memobtn]")){openMemo(id);return}
  if(e.target.closest("[data-star]")){star.has(id)?star.delete(id):star.add(id);store.set("star",[...star]);touch(id);e.target.classList.toggle("on");return}
  if(e.target.closest("[data-read]")){read.has(id)?read.delete(id):read.add(id);store.set("read",[...read]);touch(id);e.target.classList.toggle("on");c.classList.toggle("read");return}
  if(e.target.tagName==="IMG"){const z=$("#zoom");z.querySelector("img").src=e.target.src;z.style.display="flex";return}
  if(e.target.closest("[data-toggle]")){c.classList.toggle("open");
    if(c.classList.contains("open")&&!read.has(id)){read.add(id);store.set("read",[...read]);touch(id);c.querySelector("[data-read]").classList.add("on")}}});
// 메모 패널: 오른쪽에서 열리는 넓은 편집 창 (휴대폰은 전체 화면)
let mid=null;
function openMemo(id){const p=papers.find(x=>x.id===id);if(!p)return;mid=id;
  $("#dt").textContent=p.title_ko||p.title;$("#de").textContent=p.title;
  $("#dref").innerHTML=`<p>${esc(p.tldr)}</p><ul>${(p.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`;
  const t=$("#dmemo");t.value=memo[id]||"";dcount();
  $("#drawer").classList.add("on");document.body.classList.add("memo-open");setTimeout(()=>{t.focus();t.setSelectionRange(t.value.length,t.value.length)},60)}
function closeMemo(){if(!mid)return;$("#drawer").classList.remove("on");document.body.classList.remove("memo-open");refreshCard(mid);mid=null}
function refreshCard(id){const el=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`),p=papers.find(x=>x.id===id);if(!el||!p)return;
  const tmp=document.createElement("div");tmp.innerHTML=card(p);const n=tmp.firstElementChild;if(el.classList.contains("open"))n.classList.add("open");el.replaceWith(n)}
function dcount(){const n=$("#dmemo").value.length;$("#dcnt").textContent=n?`${n}자`:""}
$("#dmemo").addEventListener("input",e=>{if(!mid)return;const v=e.target.value;if(v.trim())memo[mid]=v;else delete memo[mid];
  store.set("memo",memo);if(!tok)setSync("이 브라우저에 저장됨");touch(mid);dcount()});
$("#dclose").onclick=closeMemo;$("#dback").onclick=closeMemo;$("#dwide").onclick=()=>$("#drawer").classList.toggle("wide");
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&mid)closeMemo()});
$("#syncpill").onclick=()=>document.getElementById("sync").scrollIntoView({behavior:"smooth"});
$("#exp").onclick=()=>{const blob=new Blob([JSON.stringify({memo,star:[...star],read:[...read]},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`paper-digest-memo-${new Date().toISOString().slice(0,10)}.json`;a.click()};
$("#imp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());
  Object.assign(memo,d.memo||{});(d.star||[]).forEach(x=>star.add(x));(d.read||[]).forEach(x=>read.add(x));
  store.set("memo",memo);store.set("star",[...star]);store.set("read",[...read]);
  new Set([...Object.keys(d.memo||{}),...(d.star||[]),...(d.read||[])]).forEach(touch);render();alert("가져왔습니다")}catch(err){alert("파일을 읽지 못했습니다")}};
$("#zoom").onclick=()=>$("#zoom").style.display="none";
$("#tags").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;tag=tag===b.dataset.tag?"":b.dataset.tag;renderTags();render()});
$("#sort").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;sort=b.dataset.s;
  document.querySelectorAll("#sort button").forEach(x=>x.classList.toggle("on",x===b));
  if(sort==="score")while(loaded<months.length)await loadMonth();renderTags();render()});
$("#view").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;
  document.querySelectorAll("#view button").forEach(x=>x.classList.toggle("on",x===b));render()});
let tm;$("#q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{q=e.target.value.trim().toLowerCase();render()},150)});

(async()=>{try{const r=await fetch(`data/index.json?t=${Date.now()}`);const ix=await r.json();months=ix.months||[];
  $("#upd").textContent=`업데이트 ${ix.updated||""}`;while(loaded<months.length)await loadMonth();renderTags();render();syncUI();if(tok)sync()}
  catch(e){$("#list").innerHTML='<div class="empty">아직 수집된 논문이 없습니다</div>'}})();
</script>
</body>
</html>
